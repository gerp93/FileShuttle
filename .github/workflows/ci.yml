name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test
