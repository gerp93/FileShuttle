name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Typecheck renderer
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck server
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Unit tests
        run: npm test

  node-deb:
    uses: gerp93/KVG_Standards/.github/workflows/release-node-deb.yml@main
    with:
      version: v0.0.0
      package_name: fileshuttle-server
      command_name: fileshuttle-server
      description: FileShuttle hub and worker server (no desktop app needed)
      build_command: npm ci && npm run generate-icons && npm run build:server && npm run build:renderer
      bundle: dist/server/fileshuttle-server.cjs
      install_map: |
        dist/renderer /usr/lib/fileshuttle-server/web
        deploy/fileshuttle-server.service /usr/lib/systemd/system/fileshuttle-server.service
        deploy/fileshuttle-server.env /etc/fileshuttle-server/server.env 0640
      conffiles: /etc/fileshuttle-server/server.env
      scripts_dir: deploy/debian
      publish: false
    # The reusable workflow declares contents: write, and a caller may not grant
    # less than a called workflow asks for (the run fails to start). publish is
    # false, so nothing is written.
    permissions:
      contents: write
