name: Auto Release

on:
  push:
    branches: [main]

concurrency:
  group: fileshuttle-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump semantic version and create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

  release:
    needs: version
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-electron.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
    permissions:
      contents: write

  node-deb:
    needs: [version, release]
    if: ${{ needs.version.outputs.new_tag != '' }}
    uses: gerp93/KVG_Standards/.github/workflows/release-node-deb.yml@main
    with:
      version: ${{ needs.version.outputs.new_tag }}
      package_name: fileshuttle-server
      command_name: fileshuttle-server
      description: FileShuttle hub and worker server (no desktop app needed)
      build_command: npm ci && npm run generate-icons && npm run build:server && npm run build:renderer
      bundle: dist/server/fileshuttle-server.cjs
      install_map: |
        dist/renderer /usr/lib/fileshuttle-server/web
        deploy/fileshuttle-server.service /usr/lib/systemd/system/fileshuttle-server.service
        deploy/fileshuttle-server.env /etc/fileshuttle-server/server.env 0640
      conffiles: /etc/fileshuttle-server/server.env
      scripts_dir: deploy/debian
    permissions:
      contents: write
